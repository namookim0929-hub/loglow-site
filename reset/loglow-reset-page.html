<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loglow — 비밀번호 재설정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif; background:#FBF8F3; color:#1a1a1a; display:flex; justify-content:center; padding:48px 20px; }
  .card { width:100%; max-width:420px; }
  .brand { font-size:22px; font-weight:800; color:#7B1BEE; margin-bottom:6px; }
  h1 { font-size:20px; font-weight:800; margin-bottom:20px; }
  label { display:block; font-size:13px; font-weight:700; color:#6a6a66; margin:14px 0 6px; }
  input { width:100%; padding:13px 14px; border:1.5px solid #E4DED4; border-radius:12px; font-size:15px; background:#fff; }
  input:focus { outline:none; border-color:#7B1BEE; }
  button { width:100%; margin-top:20px; padding:14px 0; border:none; border-radius:12px; background:linear-gradient(100deg,#7B1BEE,#9D4BF5); color:#fff; font-size:15px; font-weight:800; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:default; }
  .msg { margin-top:14px; font-size:14px; line-height:1.6; }
  .ok { color:#1E9C56; font-weight:700; }
  .err { color:#B00020; font-weight:700; }
  .hint { font-size:12px; color:#9a9a96; margin-top:4px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Loglow</div>
  <h1>비밀번호 재설정 · Reset password</h1>
  <div id="gate" class="msg">링크 확인 중… Verifying link…</div>
  <form id="form" style="display:none;">
    <label>새 비밀번호 · New password</label>
    <input type="password" id="pw1" minlength="8" required>
    <div class="hint">8자 이상, 대문자·소문자·숫자 포함 · 8+ chars incl. upper, lower, number</div>
    <label>비밀번호 확인 · Confirm password</label>
    <input type="password" id="pw2" minlength="8" required>
    <button type="submit" id="btn">비밀번호 변경 · Update password</button>
  </form>
  <div id="out" class="msg"></div>
</div>
<script>
  const SUPABASE_URL = 'https://oikxxbexmljbklctyegj.supabase.co';
  const SUPABASE_ANON_KEY = '⚠️PASTE_ANON_KEY_HERE'; // dashboard -> Settings -> API -> anon public
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const gate = document.getElementById('gate'), form = document.getElementById('form'), out = document.getElementById('out'), btn = document.getElementById('btn');

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (session && location.hash.includes('type=recovery'))) {
      gate.style.display = 'none'; form.style.display = 'block';
    }
  });
  // Fallback: if session already established from the URL by the time we run
  sb.auth.getSession().then(({ data }) => {
    if (data.session) { gate.style.display = 'none'; form.style.display = 'block'; }
    else setTimeout(() => { if (form.style.display === 'none') gate.innerHTML = '<span class="err">링크가 유효하지 않거나 만료되었습니다. 앱에서 재설정 메일을 다시 요청해주세요.<br>Link invalid or expired — request a new reset email in the app.</span>'; }, 3000);
  });

  const strong = p => p.length >= 8 && /[A-Z]/.test(p) && /[a-z]/.test(p) && /[0-9]/.test(p);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
    if (p1 !== p2) { out.innerHTML = '<span class="err">비밀번호가 일치하지 않습니다 · Passwords do not match</span>'; return; }
    if (!strong(p1)) { out.innerHTML = '<span class="err">비밀번호 조건을 확인해주세요 · Password does not meet requirements</span>'; return; }
    btn.disabled = true;
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { out.innerHTML = '<span class="err">변경 실패: ' + error.message + '</span>'; btn.disabled = false; }
    else { form.style.display = 'none'; out.innerHTML = '<span class="ok">✅ 비밀번호가 변경되었습니다!<br>Loglow 앱으로 돌아가 새 비밀번호로 로그인해주세요.<br>Password updated — return to the Loglow app and sign in.</span>'; }
  });
</script>
</body>
</html>
